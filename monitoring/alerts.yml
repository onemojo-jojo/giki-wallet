groups:
  - name: giki-wallet
    rules:
      - alert: DatabaseConnectionPressure
        expr: giki_backend_db_pool_connections{state="acquired"} / clamp_min(giki_backend_db_pool_max_connections, 1) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Backend database pool is over 80% acquired
          description: Check booking request volume, slow queries, and pool wait metrics.

      - alert: DatabasePoolWaiting
        expr: increase(giki_backend_db_pool_empty_acquire_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Backend requests waited for a database connection
          description: Empty pool acquisitions increased in the last five minutes.

      - alert: BookingServerErrors
        expr: sum(increase(giki_backend_http_requests_total{route=~".*/(holds|confirm).*",status=~"5.."}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Booking API returned server errors
          description: Inspect backend logs and PostgreSQL metrics for the affected interval.

      - alert: PostgreSQLConnectionPressure
        expr: sum(pg_stat_activity_count{state!="idle"}) / clamp_min(pg_settings_max_connections, 1) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL active connections exceed 80% of configured maximum
          description: Check connection consumers and database query duration before raising max_connections.
