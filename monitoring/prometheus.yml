global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: giki-backend
    metrics_path: /metrics
    static_configs:
      - targets: [backend:8080]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: host
    static_configs:
      - targets: [node-exporter:9100]
